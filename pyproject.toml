[project]
name = "source-grounded-review"
version = "0.1.0"
description = "A small source-grounded review drafting and citation-checking tool."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "pypdf>=5.0.0",
  "langgraph>=0.2.0",
]

[project.scripts]
evidence-review = "source_grounded_review.cli:main"

